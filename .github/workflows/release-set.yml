name: LO WASM Release Set

# Single merged pipeline (pdfium splits this into build.yml + release.yml; the
# LO builder keeps one workflow, deviation 2's state machine intact):
#   resolve-release-set  — validate the dispatched public manifest against the
#                          private release-set source's committed content
#                          (deviation 1/1b; fetched via read deploy key, secret
#                          RELEASE_SET_REPOSITORY + RELEASE_SET_READ_DEPLOY_KEY)
#   build                — SERIAL heavy emscripten matrix (max-parallelism: 1,
#                          BUILD_JOBS=4, 350-min timeout; AC11: one LO compile
#                          at a time, RAM-limited, ~350 min each)
#   accept-candidates    — bind candidate evidence into the accepted set
#   promote              — lightweight role-conditional publication with
#                          neutral verbs only (prepare/materialize/promote/
#                          finalize); never a plaintext dev payload upload.
#
# Trigger contract: workflow_dispatch (manual contract re-run) and
# repository_dispatch type source-release-set-v1 (public source face). The
# dispatch carries ONLY public contract fields — never variant names, domains,
# seeds, or the private source repository.

on:
  workflow_dispatch:
    inputs:
      contract_version:
        description: Source contract schema version (validation only)
        required: true
        type: string
      source_revision:
        description: Upstream LO core commit, 40-hex (identity only)
        required: true
        type: string
      release_id:
        description: Canonical release-v1 ID
        required: true
        type: string
      manifest:
        description: Public release-set JSON (complete dev and prod set)
        required: true
        type: string
  repository_dispatch:
    types:
      - source-release-set-v1
  workflow_run:
    workflows: ["LO WASM Release Set"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lo-release-set-${{ github.event_name }}-${{ inputs.release_id || github.event.client_payload.release_id || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-set:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Resolve release set
    outputs:
      contract_version: ${{ steps.contract.outputs.contract_version }}
      source_revision: ${{ steps.contract.outputs.source_revision }}
      release_id: ${{ steps.contract.outputs.release_id }}
      manifest: ${{ steps.contract.outputs.manifest }}
      targets: ${{ steps.contract.outputs.targets }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout private release-set source
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.RELEASE_SET_REPOSITORY }}
          ssh-key: ${{ secrets.RELEASE_SET_READ_DEPLOY_KEY }}
          path: release-set-repo
          persist-credentials: false
          submodules: 'false'

      - name: Validate source contract
        id: contract
        env:
          CONTRACT_VERSION: ${{ github.event_name == 'workflow_dispatch' && '1' || github.event.client_payload.contract_version }}
          # Deviation 1b: the upstream LO core commit is identity-only. It is
          # validated as 40-hex by the contract script and NEVER resolved
          # against the release-set source's Git.
          SOURCE_REVISION: ${{ inputs.source_revision || github.event.client_payload.source_revision }}
          RELEASE_ID: ${{ inputs.release_id || github.event.client_payload.release_id }}
          DISPATCH_MANIFEST: ${{ inputs.manifest || toJSON(github.event.client_payload.manifest) }}
        run: |
          printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json
          bash ci/build-info-contract.sh validate-source-manifest \
            --manifest release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID"

          # Independent builder-side verification (deviation 1: the manifest is
          # re-derived from the private release-set source's committed content,
          # always read from that checkout's committed tree).
          python3 build/release_set.py verify \
            --repo-root release-set-repo \
            --source-revision "$SOURCE_REVISION" \
            --manifest release-set.json \
            --release-id "$RELEASE_ID"
          {
            echo "contract_version=$CONTRACT_VERSION"
            echo "source_revision=$SOURCE_REVISION"
            echo "release_id=$RELEASE_ID"
            echo "manifest=$(jq -c . release-set.json)"
            echo "targets=$(bash ci/build-info-contract.sh print-release-matrix \
              --manifest release-set.json \
              --contract-version "$CONTRACT_VERSION" \
              --source-revision "$SOURCE_REVISION" \
              --release-id "$RELEASE_ID")"
          } >> "$GITHUB_OUTPUT"

  build-info-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Build-info contract test

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test build-info contract
        run: bash ci/run-tests.sh

  build:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    needs: resolve-release-set
    runs-on: ubuntu-latest
    timeout-minutes: 350
    name: Candidate build (${{ matrix.build_role }}, ${{ matrix.target_id }})
    strategy:
      fail-fast: false
      # AC11: the heavy emscripten face is SERIAL by construction — one LO
      # compile at a time, ordered by target_id, never concurrent.
      max-parallel: 1
    matrix: ${{ fromJSON(needs.resolve-release-set.outputs.targets) }}
    env:
      BUILD_JOBS: "4"
      EMSDK_VERSION: "3.1.74"
      TZ: Etc/UTC

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout private release-set source
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.RELEASE_SET_REPOSITORY }}
          ssh-key: ${{ secrets.RELEASE_SET_READ_DEPLOY_KEY }}
          path: release-set-repo
          persist-credentials: false
          submodules: 'false'

      - name: Checkout public runtime source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-release-set.outputs.source_revision }}
          path: source
          submodules: 'false'

      - name: Verify pinned source revision
        env:
          EXPECTED_SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
        run: |
          # Deviation 1b: identity binds the upstream LO core commit; the
          # checkout must match it exactly before any compilation.
          SOURCE_CHECKOUT_SHA=$(git -C source rev-parse HEAD)
          [[ "$SOURCE_CHECKOUT_SHA" == "$EXPECTED_SOURCE_REVISION" ]] || {
            echo "::error::Public source checkout differs from the resolved revision"
            exit 1
          }

      - name: Verify release target
        env:
          CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
          BUILD_ROLE: ${{ matrix.build_role }}
          DISPATCH_MANIFEST: ${{ needs.resolve-release-set.outputs.manifest }}
        run: |
          printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json
          python3 build/release_set.py verify \
            --repo-root release-set-repo \
            --source-revision "$SOURCE_REVISION" \
            --manifest release-set.json \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID"
          jq -e --arg target_id "$TARGET_ID" --arg build_role "$BUILD_ROLE" \
            '.targets[] | select(.target_id == $target_id) | .build_role == $build_role' \
            release-set.json >/dev/null

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          cd /opt/emsdk
          ./emsdk install "$EMSDK_VERSION" --shallow
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          emcc --version

      - name: Inject variant configs into source checkout
        run: |
          # build-wasm.sh resolves variants relative to the SOURCE checkout
          # (build-wasm.sh:39), so the private release-set source's committed
          # content is injected into it ephemerally BEFORE the heavy build
          # and scrubbed with the payload (deviation 4). Sourced from the
          # release-set-repo checkout — never from the seed-free builder tree
          # — and never logged.
          cp -r release-set-repo/variants source/variants

      - name: Build release target
        env:
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
        run: |
          # The variant is resolved internally by release_set.py from the
          # target's seed. Private build selectors are NEVER accepted from the
          # environment.
          [[ -z "${BUILD_VARIANT+x}" && -z "${PRODUCT_LOCK+x}" && -z "${BUILD_TYPE+x}" ]] || {
            echo "::error::Private build selectors are not accepted by this workflow"
            exit 1
          }
          python3 build/release_set.py build \
            --repo-root release-set-repo \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --source-dir source

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends age || true
          sudo rm -rf /var/lib/apt/lists/*

      - name: Prepare candidate transport tooling
        run: bash ci/install-age.sh

      - name: Prepare candidate transport
        env:
          CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
          BUILD_ROLE: ${{ matrix.build_role }}
          MATERIALIZATION_RECIPIENT: ${{ vars.CANDIDATE_MATERIALIZATION_RECIPIENT }}
          MATERIALIZATION_KEY_ID: ${{ vars.CANDIDATE_MATERIALIZATION_KEY_ID }}
        run: |
          # The plaintext payload lives only in this unprivileged build job.
          cleanup_plaintext() {
            rm -rf candidate-payload
            rm -rf source/wasm
            rm -rf source/variants
          }
          trap cleanup_plaintext EXIT

          mkdir -p candidate-payload

          SOURCE_BUILD_INFO=source/wasm/build-info.json
          [[ -f "$SOURCE_BUILD_INFO" ]] || {
            echo "::error::Source build-info was not emitted by the heavy build"
            exit 1
          }
          cp source/wasm/soffice.wasm candidate-payload/
          cp source/README.md candidate-payload/ 2>/dev/null || printf 'LO WASM conversion runtime candidate payload.\n' > candidate-payload/README.md

          # Static package face for the candidate payload.
          cat > candidate-payload/package.json <<'EOF'
          {
            "name": "lo-wasm",
            "version": "0.0.0",
            "description": "LO WASM",
            "repository": { "url": "https://example.invalid/source" },
            "homepage": "https://example.invalid",
            "bugs": { "url": "https://example.invalid/issues" }
          }
          EOF

          bash ci/build-info-contract.sh create-candidate \
            --output candidate-payload/build-info.json \
            --payload-dir candidate-payload \
            --source-build-info "$SOURCE_BUILD_INFO" \
            --release-manifest release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --build-timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-number "${{ github.run_number }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --repository "${{ github.repository }}" \
            --builder-sha "${{ github.sha }}" \
            --lo-source-sha "$SOURCE_REVISION"

          mkdir -p candidate-metadata
          cp candidate-payload/build-info.json "candidate-metadata/$TARGET_ID.json"

          bash ci/candidate-transport.sh prepare \
            --input-dir candidate-payload \
            --output-dir candidate-transport \
            --recipient "$MATERIALIZATION_RECIPIENT" \
            --key-id "$MATERIALIZATION_KEY_ID" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --source-revision "$SOURCE_REVISION" \
            --build-role "$BUILD_ROLE"
          cleanup_plaintext
          [[ ! -e candidate-payload && ! -e source/wasm && ! -e source/variants ]] || {
            echo "::error::Plaintext candidate cleanup failed"
            exit 1
          }

      - name: Upload candidate transport
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: lo-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: candidate-transport/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record candidate evidence
        env:
          TARGET_ID: ${{ matrix.target_id }}
          MATERIALIZATION_KEY_ID: ${{ vars.CANDIDATE_MATERIALIZATION_KEY_ID }}
        run: |
          bash ci/build-info-contract.sh attach-candidate-artifact \
            --candidate "candidate-metadata/$TARGET_ID.json" \
            --transport-dir candidate-transport \
            --output "candidate-evidence/$TARGET_ID.json" \
            --expected-key-id "$MATERIALIZATION_KEY_ID" \
            --artifact-name "lo-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-$TARGET_ID" \
            --artifact-id "${{ steps.upload-candidate.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.upload-candidate.outputs.artifact-digest }}"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lo-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: candidate-evidence/${{ matrix.target_id }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: source/build/*.log
          if-no-files-found: ignore
          retention-days: 3

  accept-candidates:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    needs:
      - resolve-release-set
      - build-info-contract-test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Accept candidate builds
    env:
      CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
      SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
      RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
      EXPECTED_BUILDER_SHA: ${{ github.sha }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
      EXPECTED_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
      EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      # LO deviation: the single focused gate is the no-pthread runtime
      # contract policy; the heavy build has no native embedder suite.
      FOCUSED_TEST_FILTER: LokNoPthreadRuntimeContract.SingleProfileNoWorkerSidecar

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore validated release manifest
        env:
          DISPATCH_MANIFEST: ${{ needs.resolve-release-set.outputs.manifest }}
        run: printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json

      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: lo-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: candidate-evidence
          merge-multiple: true

      - name: Validate and accept candidates
        run: |
          bash ci/build-info-contract.sh accept-candidate-set \
            --release-manifest release-set.json \
            --evidence-dir candidate-evidence \
            --output-dir accepted \
            --accepted-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --focused-test-filter "$FOCUSED_TEST_FILTER" \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --builder-sha "$EXPECTED_BUILDER_SHA" \
            --lo-source-sha "$SOURCE_REVISION" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Upload accepted build manifests
        uses: actions/upload-artifact@v4
        with:
          name: lo-wasm-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted/
          if-no-files-found: error
          retention-days: 1

  resolve-accepted-release:
    if: >-
      ${{
        github.event.workflow_run.event == 'repository_dispatch' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Resolve accepted release
    outputs:
      targets: ${{ steps.contract.outputs.targets }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download accepted release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: lo-wasm-acceptance-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: acceptance

      - name: Validate accepted release set
        id: contract
        env:
          EXPECTED_BUILDER_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          CONTRACT_VERSION=$(jq -er '.schema_version' acceptance/release-set.json)
          SOURCE_REVISION=$(jq -er '.source_revision' acceptance/release-set.json)
          RELEASE_ID=$(jq -er '.release_id' acceptance/release-set.json)
          bash ci/build-info-contract.sh validate-source-manifest \
            --manifest acceptance/release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID"

          EXPECTED_COUNT=$(jq -er '.targets | length' acceptance/release-set.json)
          ACTUAL_COUNT=$(find acceptance -mindepth 2 -maxdepth 2 -name build-info.json -type f | wc -l)
          [[ "$ACTUAL_COUNT" == "$EXPECTED_COUNT" ]] || {
            echo "::error::Accepted manifest set has the wrong cardinality"
            exit 1
          }

          while IFS= read -r target_id; do
            accepted="acceptance/$target_id/build-info.json"
            [[ -f "$accepted" ]] || {
              echo "::error::Accepted manifest is missing for $target_id"
              exit 1
            }
            jq -e \
              --arg target_id "$target_id" \
              --arg source_revision "$SOURCE_REVISION" \
              --arg release_id "$RELEASE_ID" \
              --arg repository "$EXPECTED_REPOSITORY" \
              --arg builder_sha "$EXPECTED_BUILDER_SHA" \
              --arg workflow_run_id "$EXPECTED_WORKFLOW_RUN_ID" \
              --arg workflow_run_number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
              --arg workflow_run_attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT" '
                .artifact_status == "accepted" and
                .target_id == $target_id and
                .source_revision == $source_revision and
                .release_id == $release_id and
                .repository == $repository and
                .builder_sha == $builder_sha and
                .workflow_run_id == $workflow_run_id and
                .workflow_run_number == $workflow_run_number and
                .workflow_run_attempt == $workflow_run_attempt
              ' "$accepted" >/dev/null || {
                echo "::error::Accepted manifest identity is invalid for $target_id"
                exit 1
              }
          done < <(jq -r '.targets[].target_id' acceptance/release-set.json)

          echo "targets=$(bash ci/build-info-contract.sh print-release-matrix \
            --manifest acceptance/release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID")" >> "$GITHUB_OUTPUT"

  promote:
    needs: resolve-accepted-release
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    environment: Candidate Promotion
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-accepted-release.outputs.targets) }}
    name: Promote (${{ matrix.target_id }})
    concurrency:
      group: lo-promote-${{ matrix.target_id }}
      cancel-in-progress: false
    env:
      TARGET_ID: ${{ matrix.target_id }}
      BUILD_ROLE: ${{ matrix.build_role }}
      EXPECTED_BUILDER_SHA: ${{ github.event.workflow_run.head_sha }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      EXPECTED_WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download accepted release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: lo-wasm-acceptance-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: acceptance

      - name: Resolve accepted target
        env:
          SUPPORTED_KEY_IDS: ${{ vars.CANDIDATE_MATERIALIZATION_KEY_IDS }}
        run: |
          ACCEPTED="acceptance/$TARGET_ID/build-info.json"
          [[ -f "$ACCEPTED" ]] || {
            echo "::error::Accepted target manifest is missing"
            exit 1
          }

          CONTRACT_VERSION=$(jq -er '.schema_version' acceptance/release-set.json)
          SOURCE_REVISION=$(jq -er '.source_revision' acceptance/release-set.json)
          RELEASE_ID=$(jq -er '.release_id' acceptance/release-set.json)
          LO_SOURCE_SHA=$(jq -er '.lo_source_sha' "$ACCEPTED")
          KEY_ID=$(jq -er '.key_id' "$ACCEPTED")
          PAYLOAD_DIGEST=$(jq -er '.payload_digest' "$ACCEPTED")
          TRANSPORT_DIGEST=$(jq -er '.transport_digest' "$ACCEPTED")
          ARTIFACT_NAME=$(jq -er '.candidate_artifact.name' "$ACCEPTED")
          ARTIFACT_ID=$(jq -er '.candidate_artifact.id' "$ACCEPTED")
          ARTIFACT_DIGEST=$(jq -er '.candidate_artifact.digest' "$ACCEPTED")
          ACCEPTED_ROLE=$(jq -er '.build_role' "$ACCEPTED")

          [[ "$ACCEPTED_ROLE" == "$BUILD_ROLE" ]] || {
            echo "::error::Accepted build role differs from release matrix"
            exit 1
          }
          tr ', ' '\n\n' <<<"$SUPPORTED_KEY_IDS" | grep -Fx "$KEY_ID" >/dev/null || {
            echo "::error::Accepted materialization key ID is not supported"
            exit 1
          }

          {
            echo "CONTRACT_VERSION=$CONTRACT_VERSION"
            echo "SOURCE_REVISION=$SOURCE_REVISION"
            echo "RELEASE_ID=$RELEASE_ID"
            echo "LO_SOURCE_SHA=$LO_SOURCE_SHA"
            echo "KEY_ID=$KEY_ID"
            echo "PAYLOAD_DIGEST=$PAYLOAD_DIGEST"
            echo "TRANSPORT_DIGEST=$TRANSPORT_DIGEST"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
            echo "ARTIFACT_ID=$ARTIFACT_ID"
            echo "ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Verify candidate transport artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$EXPECTED_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          jq -e \
            --arg name "$ARTIFACT_NAME" \
            --arg id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg run_id "$EXPECTED_WORKFLOW_RUN_ID" '
              .id == ($id | tonumber) and
              .name == $name and
              .digest == $digest and
              .expired == false and
              .workflow_run.id == ($run_id | tonumber)
            ' artifact.json >/dev/null || {
              echo "::error::Candidate artifact REST identity differs from accepted evidence"
              exit 1
            }

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$EXPECTED_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > candidate-transport.zip
          mkdir candidate-transport
          unzip -q candidate-transport.zip -d candidate-transport

          bash ci/build-info-contract.sh validate-transport-pair \
            --transport-dir candidate-transport \
            --accepted "acceptance/$TARGET_ID/build-info.json" \
            --release-manifest acceptance/release-set.json \
            --target-id "$TARGET_ID" \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --builder-sha "$EXPECTED_BUILDER_SHA" \
            --checked-out-builder-sha "$(git rev-parse HEAD)" \
            --lo-source-sha "$LO_SOURCE_SHA" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST"

      - name: Prepare candidate transport tooling
        run: bash ci/install-age.sh

      - name: Materialize candidate payload
        env:
          MATERIALIZATION_IDENTITIES: ${{ secrets.CANDIDATE_MATERIALIZATION_IDENTITIES }}
        run: |
          umask 077
          IDENTITY_FILE="$RUNNER_TEMP/candidate-materialization-identities"
          trap 'rm -f "$IDENTITY_FILE"' EXIT
          [[ -n "$MATERIALIZATION_IDENTITIES" ]] || {
            echo "::error::Candidate Promotion secret CANDIDATE_MATERIALIZATION_IDENTITIES is empty"
            exit 1
          }
          printf '%s\n' "$MATERIALIZATION_IDENTITIES" > "$IDENTITY_FILE"
          grep -Eq '^AGE-SECRET-KEY-1[0-9A-Z]+$' "$IDENTITY_FILE" || {
            echo "::error::Candidate Promotion secret does not contain an age X25519 private identity"
            exit 1
          }
          bash ci/candidate-transport.sh materialize \
            --transport-dir candidate-transport \
            --output-dir "$RUNNER_TEMP/materialized/$TARGET_ID" \
            --identity-file "$IDENTITY_FILE" \
            --expected-key-id "$KEY_ID" \
            --expected-payload-digest "$PAYLOAD_DIGEST" \
            --expected-transport-digest "$TRANSPORT_DIGEST" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --source-revision "$SOURCE_REVISION" \
            --build-role "$BUILD_ROLE"

      - name: Verify release payload
        run: |
          bash ci/build-info-contract.sh validate-release-pair \
            --candidate "$RUNNER_TEMP/materialized/$TARGET_ID/build-info.json" \
            --accepted "acceptance/$TARGET_ID/build-info.json" \
            --release-manifest acceptance/release-set.json \
            --target-id "$TARGET_ID" \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --builder-sha "$EXPECTED_BUILDER_SHA" \
            --checked-out-builder-sha "$(git rev-parse HEAD)" \
            --lo-source-sha "$LO_SOURCE_SHA" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Prepare accepted build
        run: |
          bash ci/promote-accepted-build.sh prepare \
            --artifact-dir "$RUNNER_TEMP/materialized/$TARGET_ID" \
            --accepted-manifest "acceptance/$TARGET_ID/build-info.json" \
            --output-dir "$RUNNER_TEMP/prepared/$TARGET_ID" \
            --build-role "$BUILD_ROLE" \
            --target-id "$TARGET_ID" \
            --repository "$EXPECTED_REPOSITORY"

      - name: Remove materialized candidate files
        run: |
          rm -rf "$RUNNER_TEMP/materialized/$TARGET_ID"
          [[ ! -e "$RUNNER_TEMP/materialized/$TARGET_ID" ]] || {
            echo "::error::Materialized candidate cleanup failed"
            exit 1
          }

      - name: Setup source publication access
        if: ${{ matrix.build_role == 'dev' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_RELEASE_DEPLOY_KEY }}

      - name: Promote accepted dev build
        if: ${{ matrix.build_role == 'dev' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        run: |
          bash ci/promote-accepted-build.sh publish \
            --release-dir "$RUNNER_TEMP/prepared/$TARGET_ID" \
            --accepted-manifest "acceptance/$TARGET_ID/build-info.json" \
            --build-role "$BUILD_ROLE" \
            --target-id "$TARGET_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --source-repository "$SOURCE_REPOSITORY" \
            --workflow-id "$TRIGGER_WORKFLOW_ID" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Promote accepted production build
        if: ${{ matrix.build_role == 'prod' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ci/promote-accepted-build.sh publish \
            --release-dir "$RUNNER_TEMP/prepared/$TARGET_ID" \
            --accepted-manifest "acceptance/$TARGET_ID/build-info.json" \
            --build-role "$BUILD_ROLE" \
            --target-id "$TARGET_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --workflow-id "$TRIGGER_WORKFLOW_ID" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Finalize candidate transport
        id: finalize-transport
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE "repos/$EXPECTED_REPOSITORY/actions/artifacts/$ARTIFACT_ID"

      - name: Report candidate transport cleanup failure
        if: ${{ steps.finalize-transport.outcome == 'failure' }}
        run: echo "::warning::Candidate transport cleanup failed; one-day retention remains the fallback"

      - name: Remove temporary candidate files
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/materialized/$TARGET_ID"
          rm -rf "$RUNNER_TEMP/prepared/$TARGET_ID"
          rm -f "$RUNNER_TEMP/candidate-materialization-identities"
