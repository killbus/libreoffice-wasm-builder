name: LO WASM Build

# Build face of the two-file pipeline (release face: release.yml, which
# listens to this workflow's name "LO WASM Build" via workflow-run).
# A single merged file is infeasible: GitHub rejects a workflow that
# listens to its own workflow-run completion ("cannot listen to itself"),
# so the pipeline splits into a build face and a release face.
#   resolve-release-set  — validate the dispatched public manifest against
#                          the private release-set source's committed content
#                          (deviation 1/1b; fetched via read deploy key, secret
#                          SOURCE_REPOSITORY + SOURCE_READ_DEPLOY_KEY)
#   build                — SERIAL heavy emscripten matrix (max-parallel: 1,
#                          BUILD_JOBS=4, 350-min timeout; AC11: one LO compile
#                          at a time, RAM-limited, ~350 min each)
#   accept-candidates    — bind candidate evidence into the accepted set
#
# Trigger contract: workflow_dispatch (manual contract re-run; validation
# only — the release face does NOT promote workflow_dispatch runs) and
# repository_dispatch type source-release-set-v1 (the promotion-eligible
# face). The dispatch carries ONLY public contract fields — never variant
# names, domains, seeds, or the private source repository.

on:
  workflow_dispatch:
    inputs:
      contract_version:
        description: Source contract schema version (validation only)
        required: true
        type: string
      source_revision:
        description: Upstream LO core commit, 40-hex (identity only)
        required: true
        type: string
      release_id:
        description: Canonical release-v1 ID
        required: true
        type: string
      manifest:
        description: Public release-set JSON (complete dev and prod set)
        required: true
        type: string
  repository_dispatch:
    types:
      - source-release-set-v1

permissions:
  contents: read

concurrency:
  group: lo-build-${{ github.event_name }}-${{ inputs.release_id || github.event.client_payload.release_id || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-set:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: Candidate Build
    timeout-minutes: 10
    name: Resolve release set
    outputs:
      contract_version: ${{ steps.contract.outputs.contract_version }}
      source_revision: ${{ steps.contract.outputs.source_revision }}
      release_id: ${{ steps.contract.outputs.release_id }}
      manifest: ${{ steps.contract.outputs.manifest }}
      targets: ${{ steps.contract.outputs.targets }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate source contract
        id: contract
        env:
          CONFIGURED_SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          CONTRACT_VERSION: ${{ github.event_name == 'workflow_dispatch' && '1' || github.event.client_payload.contract_version }}
          # Deviation 1b: the source revision is identity-only. It is validated
          # as 40-hex and pinned as a checkout ref; it is NEVER resolved against
          # the source's other history.
          SOURCE_REVISION: ${{ inputs.source_revision || github.event.client_payload.source_revision }}
          RELEASE_ID: ${{ inputs.release_id || github.event.client_payload.release_id }}
          DISPATCH_MANIFEST: ${{ inputs.manifest || toJSON(github.event.client_payload.manifest) }}
        run: |
          [[ "$CONFIGURED_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Repository secret SOURCE_REPOSITORY is missing or invalid"
            exit 1
          }
          printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json
          bash ci/build-info-contract.sh validate-source-manifest \
            --manifest release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID"
          {
            echo "contract_version=$CONTRACT_VERSION"
            echo "source_revision=$SOURCE_REVISION"
            echo "release_id=$RELEASE_ID"
            echo "manifest=$(jq -c . release-set.json)"
            echo "targets=$(bash ci/build-info-contract.sh print-release-matrix \
              --manifest release-set.json \
              --contract-version "$CONTRACT_VERSION" \
              --source-revision "$SOURCE_REVISION" \
              --release-id "$RELEASE_ID")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.contract.outputs.source_revision }}
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_DEPLOY_KEY }}
          submodules: 'false'

      - name: Verify pinned source contract
        id: source
        env:
          SOURCE_REVISION: ${{ steps.contract.outputs.source_revision }}
          RELEASE_ID: ${{ steps.contract.outputs.release_id }}
        run: |
          python3 build/release_set.py --repo-root source verify \
            --source-revision "$SOURCE_REVISION" \
            --manifest release-set.json \
            --release-id "$RELEASE_ID"

  build-info-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Build-info contract test

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test build-info contract
        run: bash ci/run-tests.sh

  build:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    needs: resolve-release-set
    runs-on: ubuntu-latest
    environment: Candidate Build
    timeout-minutes: 350
    name: Candidate build (${{ matrix.build_role }}, ${{ matrix.target_id }})
    strategy:
      fail-fast: false
      # AC11: the heavy emscripten face is SERIAL by construction — one LO
      # compile at a time, ordered by target_id, never concurrent.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve-release-set.outputs.targets) }}
    env:
      BUILD_JOBS: "4"
      EMSDK_VERSION: "3.1.74"
      TZ: Etc/UTC

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-release-set.outputs.source_revision }}
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_DEPLOY_KEY }}
          submodules: 'false'

      - name: Verify pinned source revision
        env:
          EXPECTED_SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
        run: |
          # Deviation 1b: identity binds the resolved source revision; the
          # checkout must match it exactly before any compilation.
          SOURCE_CHECKOUT_SHA=$(git -C source rev-parse HEAD)
          [[ "$SOURCE_CHECKOUT_SHA" == "$EXPECTED_SOURCE_REVISION" ]] || {
            echo "::error::Source checkout differs from the resolved revision"
            exit 1
          }

      - name: Verify release target
        env:
          CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
          BUILD_ROLE: ${{ matrix.build_role }}
          DISPATCH_MANIFEST: ${{ needs.resolve-release-set.outputs.manifest }}
        run: |
          printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json
          python3 build/release_set.py --repo-root source verify \
            --source-revision "$SOURCE_REVISION" \
            --manifest release-set.json \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID"
          jq -e --arg target_id "$TARGET_ID" --arg build_role "$BUILD_ROLE" \
            '.targets[] | select(.target_id == $target_id) | .build_role == $build_role' \
            release-set.json >/dev/null

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          cd /opt/emsdk
          ./emsdk install "$EMSDK_VERSION" --shallow
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          emcc --version

      - name: Build release target
        env:
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
        run: |
          # The variant is resolved internally by release_set.py from the
          # target's seed. Private build selectors are NEVER accepted from the
          # environment.
          [[ -z "${BUILD_VARIANT+x}" && -z "${PRODUCT_LOCK+x}" && -z "${BUILD_TYPE+x}" ]] || {
            echo "::error::Private build selectors are not accepted by this workflow"
            exit 1
          }
          python3 build/release_set.py --repo-root source build \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --source-dir source

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends age || true
          sudo rm -rf /var/lib/apt/lists/*

      - name: Prepare candidate transport tooling
        run: bash ci/install-age.sh

      - name: Prepare candidate transport
        env:
          CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
          BUILD_ROLE: ${{ matrix.build_role }}
          MATERIALIZATION_RECIPIENT: ${{ vars.CANDIDATE_MATERIALIZATION_RECIPIENT }}
          MATERIALIZATION_KEY_ID: ${{ vars.CANDIDATE_MATERIALIZATION_KEY_ID }}
        run: |
          # The plaintext payload lives only in this unprivileged build job.
          cleanup_plaintext() {
            rm -rf candidate-payload
            rm -rf source/wasm
            rm -rf source/variants
          }
          trap cleanup_plaintext EXIT

          mkdir -p candidate-payload/dist

          SOURCE_BUILD_INFO=source/wasm/build-info.json
          [[ -f "$SOURCE_BUILD_INFO" ]] || {
            echo "::error::Source build-info was not emitted by the heavy build"
            exit 1
          }
          cp source/wasm/soffice.wasm candidate-payload/dist/
          cp source/README.md candidate-payload/ 2>/dev/null || printf 'LO WASM conversion runtime candidate payload.\n' > candidate-payload/README.md

          # Static package face for the candidate payload.
          cat > candidate-payload/package.json <<'EOF'
          {
            "name": "lo-wasm",
            "version": "0.0.0",
            "description": "LO WASM",
            "repository": { "url": "https://example.invalid/source" },
            "homepage": "https://example.invalid",
            "bugs": { "url": "https://example.invalid/issues" }
          }
          EOF

          bash ci/build-info-contract.sh create-candidate \
            --output candidate-payload/build-info.json \
            --payload-dir candidate-payload \
            --source-build-info "$SOURCE_BUILD_INFO" \
            --release-manifest release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --build-timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-number "${{ github.run_number }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --repository "${{ github.repository }}" \
            --builder-sha "${{ github.sha }}" \
            --lo-source-sha "$SOURCE_REVISION"

          mkdir -p candidate-metadata
          cp candidate-payload/build-info.json "candidate-metadata/$TARGET_ID.json"

          bash ci/candidate-transport.sh prepare \
            --input-dir candidate-payload \
            --output-dir candidate-transport \
            --recipient "$MATERIALIZATION_RECIPIENT" \
            --key-id "$MATERIALIZATION_KEY_ID" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --source-revision "$SOURCE_REVISION" \
            --build-role "$BUILD_ROLE"
          cleanup_plaintext
          [[ ! -e candidate-payload && ! -e source/wasm && ! -e source/variants ]] || {
            echo "::error::Plaintext candidate cleanup failed"
            exit 1
          }

      - name: Upload candidate transport
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: lo-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: candidate-transport/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record candidate evidence
        env:
          TARGET_ID: ${{ matrix.target_id }}
          MATERIALIZATION_KEY_ID: ${{ vars.CANDIDATE_MATERIALIZATION_KEY_ID }}
        run: |
          bash ci/build-info-contract.sh attach-candidate-artifact \
            --candidate "candidate-metadata/$TARGET_ID.json" \
            --transport-dir candidate-transport \
            --output "candidate-evidence/$TARGET_ID.json" \
            --expected-key-id "$MATERIALIZATION_KEY_ID" \
            --artifact-name "lo-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-$TARGET_ID" \
            --artifact-id "${{ steps.upload-candidate.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.upload-candidate.outputs.artifact-digest }}"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: lo-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: candidate-evidence/${{ matrix.target_id }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: source/build/*.log
          if-no-files-found: ignore
          retention-days: 3

  accept-candidates:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    needs:
      - resolve-release-set
      - build-info-contract-test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Accept candidate builds
    env:
      CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
      SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
      RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
      EXPECTED_BUILDER_SHA: ${{ github.sha }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
      EXPECTED_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
      EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      # LO deviation: the single focused gate is the no-pthread runtime
      # contract policy; the heavy build has no native embedder suite.
      FOCUSED_TEST_FILTER: LokNoPthreadRuntimeContract.SingleProfileNoWorkerSidecar

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore validated release manifest
        env:
          DISPATCH_MANIFEST: ${{ needs.resolve-release-set.outputs.manifest }}
        run: printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json

      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: lo-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: candidate-evidence
          merge-multiple: true

      - name: Validate and accept candidates
        run: |
          bash ci/build-info-contract.sh accept-candidate-set \
            --release-manifest release-set.json \
            --evidence-dir candidate-evidence \
            --output-dir accepted \
            --accepted-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --focused-test-filter "$FOCUSED_TEST_FILTER" \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --builder-sha "$EXPECTED_BUILDER_SHA" \
            --lo-source-sha "$SOURCE_REVISION" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Upload accepted build manifests
        uses: actions/upload-artifact@v4
        with:
          name: lo-wasm-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted/
          if-no-files-found: error
          retention-days: 1
